<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海龟汤 · 主站</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/img/turtle.svg" type="image/svg+xml" />
</head>
<body class="app-body">
  <!-- 右上角 开灯/关灯 开关：白天显示小月亮（点击关灯），夜晚显示发光小太阳 -->
  <button class="theme-toggle" id="themeToggle" title="关灯" aria-label="切换昼夜模式">
    <span class="theme-icon" id="themeIcon">🌙</span>
  </button>

  <div class="app-shell">
    <!-- 左侧侧边导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="/img/turtle.svg" alt="海龟汤" />
        <span>海龟汤</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#/ai" class="nav-item" data-route="ai">
          <svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 014 4c0 .5-.1 1-.3 1.4l1.9 1.9A4 4 0 0120 9a4 4 0 01-4 4c-.5 0-1-.1-1.4-.3l-1.9 1.9c.2.4.3.9.3 1.4a4 4 0 01-4 4 4 4 0 01-4-4c0-.5.1-1 .3-1.4L3.4 12.7A4 4 0 014 13a4 4 0 01-4-4 4 4 0 014-4c.5 0 1 .1 1.4.3l1.9-1.9A4 4 0 018 2a4 4 0 014 0z"/></svg>
          <span>AI陪玩</span>
        </a>
        <a href="#/library" class="nav-item" data-route="library">
          <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
          <span>海龟汤库</span>
        </a>
        <a href="#/add" class="nav-item" data-route="add">
          <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          <span>添加海龟汤</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip" id="userChip" title="点击修改 AI 接口配置">
          <span class="user-avatar" id="userAvatar">🐢</span>
          <span class="user-name" id="userName">未登录</span>
        </div>
        <button class="btn btn-ghost btn-block" id="logoutBtn">退出登录</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="mainContent">
      <!-- 由路由动态渲染 -->
    </main>
  </div>

  <!-- 预览弹窗 -->
  <div class="modal-mask" id="previewMask" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 id="previewTitle">汤名</h3>
        <button class="modal-close" id="previewClose">✕</button>
      </div>
      <div class="modal-meta" id="previewMeta"></div>
      <div class="modal-body">
        <div class="modal-section">
          <h4>🥣 汤面</h4>
          <div class="modal-scroll" id="previewFace"></div>
        </div>
        <div class="modal-section" id="bottomSection" style="display:none">
          <h4>🔍 汤底</h4>
          <div class="modal-scroll" id="previewBottom"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" id="revealBottomBtn">查看汤底</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
