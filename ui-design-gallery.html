<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 设计灵感 · 100 个优秀网站</title>
<style>
  :root {
    --bg: #0e0f11;
    --panel: #17181c;
    --panel-2: #1e1f24;
    --ink: #e8e6e1;
    --muted: #8b8a86;
    --accent: #ff5c35;
    --accent-2: #ffb300;
    --line: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Iowan Old Style", "Songti SC", "SimSun", serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 80px;
  }
  /* header */
  header {
    padding: 72px 32px 40px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
  }
  header .kicker {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  header h1 {
    font-size: clamp(40px, 7vw, 84px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -.02em;
  }
  header h1 em {
    font-style: italic;
    color: var(--accent-2);
  }
  header p.sub {
    margin-top: 22px;
    max-width: 560px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* nav */
  nav.toc {
    max-width: 1200px;
    margin: 8px auto 0;
    padding: 0 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(var(--bg) 70%, transparent);
    padding-top: 16px;
    padding-bottom: 20px;
  }
  nav.toc a {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 999px;
    transition: all .2s ease;
  }
  nav.toc a:hover { color: var(--ink); border-color: var(--accent); background: rgba(255,92,53,.08); }
  /* sections */
  main { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  section.cat { margin-top: 56px; }
  section.cat > h2 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -.01em;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  section.cat > h2 .num {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px;
    color: var(--accent);
  }
  section.cat > h2 .cnt {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }
  a.site {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    position: relative;
    overflow: hidden;
  }
  a.site::after {
    content: "→";
    position: absolute;
    top: 18px; right: 18px;
    font-family: ui-monospace, monospace;
    color: var(--muted);
    opacity: 0;
    transform: translateX(-6px);
    transition: all .18s ease;
  }
  a.site:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: var(--panel-2);
  }
  a.site:hover::after { opacity: 1; transform: translateX(0); color: var(--accent); }
  a.site .name {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  a.site .url {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    word-break: break-all;
  }
  a.site .note {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }
  footer {
    max-width: 1200px;
    margin: 80px auto 0;
    padding: 0 32px;
    color: var(--muted);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>

</header>

const toc = document.getElementById('toc');
let total = 0;

data.forEach((group, gi) => {
  total += group.sites.length;

  const tocLink = document.createElement('a');
  tocLink.href = '#cat-' + gi;
  tocLink.textContent = group.cat;
  toc.appendChild(tocLink);

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-' + gi;

  const h2 = document.createElement('h2');
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = String(gi + 1).padStart(2, '0');
  const title = document.createElement('span');
  title.textContent = group.cat;
  const cnt = document.createElement('span');
  cnt.className = 'cnt';
  cnt.textContent = group.sites.length + ' 个';
  h2.appendChild(num);
  h2.appendChild(title);
  h2.appendChild(cnt);
  section.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';

  group.sites.forEach(([name, url, note]) => {
    const a = document.createElement('a');
    a.className = 'site';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';

    const nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = name;
    const u = document.createElement('div');
    u.className = 'url';
    u.textContent = url.replace(/^https?:\/\//, '');
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = note;

    a.appendChild(nm);
    a.appendChild(u);
    a.appendChild(n);
    grid.appendChild(a);
  });

  section.appendChild(grid);
  main.appendChild(section);
});

document.querySelector('footer').textContent = `共 ${total} 个站点 · 点击卡片在新标签页打开对应官网`;
